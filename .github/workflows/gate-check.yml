# Cirkel Governance Gate — CI  [Fase 1 · Modul 4.4 / Governance]
# Kører på hver pull request. Samme regler som .husky/pre-commit + verifikationer
# der ikke giver mening lokalt (package.json name, PR-titel-format).
#
# Master-spec: docs/CIRKEL-EVERYTHING-v3.md · Modul 4.4 Governance Gate

name: Cirkel Governance Gate

on:
  pull_request:
    branches: [master, main]

jobs:
  gate-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Block hardkodede secrets i PR-diff
        run: |
          BASE="origin/${{ github.base_ref }}"
          if git diff "$BASE"..HEAD -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs' '*.cjs' '*.json' '*.md' '*.env*' '*.yml' '*.yaml' | grep -qE "(AIza[0-9A-Za-z_-]{35}|sk-ant-[0-9a-zA-Z-]{80,}|sk-[a-zA-Z0-9]{40,}|AKIA[0-9A-Z]{16}|sk_(test|live)_[0-9a-zA-Z]{24,})"; then
            echo "::error::Hardkodet secret fundet i PR-diff. Rotér + brug env-variable."
            exit 1
          fi

      - name: Block MTC/NEXUS project-ref (Modul 1.3)
        run: |
          BASE="origin/${{ github.base_ref }}"
          if git diff "$BASE"..HEAD | grep -qo "tbuluvvqhrbgfcpoifjl"; then
            echo "::error::MTC/NEXUS project-ID fundet i PR-diff. Skift til <MTC_ID_FORBIDDEN>."
            exit 1
          fi

      - name: Block destruktiv SQL uden accept
        run: |
          BASE="origin/${{ github.base_ref }}"
          if git diff "$BASE"..HEAD -- '*.sql' | grep -qiE "^\+.*\b(DROP|TRUNCATE|DELETE)\b"; then
            if [[ "${{ github.event.pull_request.title }}" != *"[ACCEPTED-BY-MICHAEL]"* ]]; then
              echo "::error::Destruktiv SQL kræver [ACCEPTED-BY-MICHAEL] i PR-titel."
              exit 1
            fi
          fi

      - name: Verify package.json name (Modul 9.1)
        run: |
          if grep -q '"name": "react-example"' package.json; then
            echo "::error::package.json skal renames fra react-example til cirkel-system."
            exit 1
          fi
